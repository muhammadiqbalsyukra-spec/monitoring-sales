<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Monitoring Pro</title>
<style>
:root{
--bg:#0f172a;--card:#1e293b;--accent:#22c55e;--text:#f8fafc;--muted:#94a3b8;
}
*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
body{margin:0;background:#f1f5f9;color:#111827}
.sidebar{position:fixed;left:0;top:0;width:250px;height:100%;background:var(--bg);color:#fff;padding:20px}
.sidebar h2{margin-top:0}
.sidebar a{display:block;color:#fff;text-decoration:none;padding:10px 0}
.main{margin-left:250px;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.value{font-size:28px;font-weight:bold;color:var(--accent)}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:15px}
th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
input,select,button{padding:10px;border:1px solid #ccc;border-radius:8px}
button{background:var(--accent);color:#fff;border:none;cursor:pointer}
.header{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="sidebar">
<h2>Sales Monitor</h2>
<a href="#">Dashboard</a>
<a href="#">Sales</a>
<a href="#">Outlet</a>
<a href="#">Produk</a>
<a href="#">Transaksi</a>
<a href="#">Target</a>
</div>

<div class="main">
<div class="header">
<h1>Dashboard SPV</h1>
<select>
<option>Semua Sales</option>
</select>
</div>

<div class="cards">
<div class="card"><div>Omzet Bulan Ini</div><div class="value">Rp 0</div></div>
<div class="card"><div>Outlet Aktif</div><div class="value">0</div></div>
<div class="card"><div>Transaksi Hari Ini</div><div class="value">0</div></div>
<div class="card"><div>Sales Aktif</div><div class="value">0</div></div>
</div>

<h2>Data Sales</h2>
<table>
<thead>
<tr>
<th>Nama</th>
<th>Target</th>
<th>Achievement</th>
<th>Outlet Aktif</th>
</tr>
</thead>
<tbody id="salesTable">
<tr>
<td>Contoh Sales</td>
<td>Rp 10.000.000</td>
<td>0%</td>
<td>0</td>
</tr>
</tbody>
</table>

<script>
console.log("Template siap dihubungkan ke Firebase");

// Firebase SDK dan konfigurasi dapat ditambahkan di sini.
// Modul yang sudah direncanakan:
// 1. Login SPV & Sales
// 2. CRUD Sales
// 3. CRUD Outlet
// 4. CRUD Produk
// 5. Input Transaksi
// 6. Target Bulanan
// 7. Dashboard Realtime
</script>
</div>
</body>
</html>
